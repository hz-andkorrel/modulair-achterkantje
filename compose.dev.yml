services:
  # PostgreSQL database service for the broker application
  # Uses the official Postgres 16 Alpine image for a lightweight setup.
  # Environment variables are loaded from the .env file, from which the ports are also mapped.
  # Data is persisted in a Docker volume to ensure it remains intact across container restarts.
  postgres:
    image: postgres:16-alpine
    container_name: hotelhub-postgres
    env_file:
      - ".env"
    ports:
      - "${DATABASE_PORT}:${DATABASE_PORT}"
    volumes:
      - ./data/postgres_dev:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d broker_db -U broker"]
      interval: 10s
      timeout: 5s
      retries: 5


  # Broker service for the hotel hub application, build from the local dockerfile.
  # Depends on the PostgreSQL service to ensure the database is ready before starting.
  # Environment variables are loaded from the .env file, and ports are mapped accordingly.
  # Data is persisted in a Docker volume to maintain state across restarts.
  broker:
    image: golang:latest
    container_name: hotelhub-broker
    working_dir: /app
    ports:
      - "${BROKER_PORT}:${BROKER_PORT}"
    volumes:
      - ./.env:/app/.env
      - ./broker:/app
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "go install github.com/mitranim/gow@latest && gow run main.go"]


  # The event bus service is created using Redis
  # Data is saved every 60 seconds if at least 1 change has occurred.
  # Within the private network, port 6379 is exposed for communication with services.
  # The host and the internet cannot access this service directly.
  # A health check is implemented to ensure the Redis server is operational.
  eventbus:
    image: redis:latest
    container_name: hotelhub-bus
    command: redis-server --save 60 1 --loglevel warning 
    networks:
      - private_network
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - ./data/redis_dev:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5


  # Another image has been added allowing for the visual management of the database.
  # pgAdmin is configured with default login credentials and maps port 8080 on the host to port 80 in the container.
  # The user is set to "5050:5050" to ensure proper file permissions. Data persists within the volume.
  # It is made sure that pgAdmin has written access to the volume, check readme for more information.
  data-explorer:
    image: dpage/pgadmin4:latest
    container_name: hotelhub-pgadmin
    user: "5050:5050"
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "8080:80"
    depends_on:
      - postgres
    volumes:
      - ./data/pgadmin_dev:/var/lib/pgadmin


# Definition of private and public networks for service isolation and communication.
# Private network is used for internal service communication (e.g., event bus).
# Public network is used for services that need to be accessible from outside.
networks:
  private_network:
    driver: bridge
  public_network:
    driver: bridge
