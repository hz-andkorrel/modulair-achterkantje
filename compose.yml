version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: broker-postgres
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker123
      POSTGRES_DB: broker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker"]
      interval: 10s
      timeout: 5s
      retries: 5

  broker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: broker-service
    environment:
      BROKER_PORT: 8081
      DATABASE_URL: postgres://broker:broker123@postgres:5432/broker_db?sslmode=disable
      JWT_EXPIRY: 10m
      JWT_ISSUER: broker-service
      PLUGINS_PERSIST_PATH: /data/plugins.json
      APP_VERSION: 1.0.0
    ports:
      - "8081:8081"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The event bus service is created using Redis
  # Data is saved every 60 seconds if at least 1 change has occurred.
  # Within the private network, port 6379 is exposed for communication with services.
  # The host and the internet cannot access this service directly.
  # A health check is implemented to ensure the Redis server is operational.
  eventbus:
    image: redis:latest
    container_name: hub_bus
    command: redis-server --save 60 1 --loglevel warning 
    networks:
      - private_network
    ports:
      - "6379:6379"  # Expose to host for cross-repo communication
    volumes:
      - ~/data/redis:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # The broker service is built from the Dockerfile in the ./broker directory.
  # It connects to both the private and public networks.
  # It depends on the event bus service to ensure it starts after the event bus is up.
  publisher:
    build: ./eventbus/publish
    container_name: hub_publisher
    networks:
      - private_network
    depends_on:
      - eventbus

  listener:
    build: ./eventbus/listen
    container_name: hub_listener
    networks:
      - private_network
    depends_on:
      - eventbus


networks:
  private_network:
    driver: bridge
  public_network:
    driver: bridge
